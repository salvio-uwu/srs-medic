<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Centro Medico Santa Cruz</title>
    <script>
      // ── Recuperación automática tras deploys en caliente ──
      // Si un chunk (JS o CSS) falla porque el deploy borró los archivos
      // con hashes viejos, forzamos una hard-reload para obtener el nuevo
      // index.html con los hashes correctos.
      // Cooldown de 10s para evitar loops infinitos.
      (function () {
        var KEY = '_srs_reload_ts';
        var COOLDOWN = 10000;
        var reloading = false;

        function forceReload() {
          if (reloading) return;
          var now = Date.now();
          var last = parseInt(sessionStorage.getItem(KEY) || '0', 10);
          if (now - last < COOLDOWN) return;
          sessionStorage.setItem(KEY, String(now));
          reloading = true;
          // Bust de caché: reload(true) ya no funciona en Chrome/Safari.
          // Forzamos un GET fresco del index.html con query única.
          var base = window.location.href.split('?')[0].split('#')[0];
          var hash = window.location.hash || '';
          window.location.replace(base + '?_r=' + now + hash);
        }

        // 1) LINK (CSS) o SCRIPT (JS) que fallan con 404 tras un deploy
        window.addEventListener('error', function (event) {
          var tag = (event.target && event.target.tagName) || '';
          if (tag === 'LINK' || tag === 'SCRIPT') forceReload();
        }, true);

        // 2) Dynamic import() falla porque Vite borró el chunk en un deploy
        window.addEventListener('unhandledrejection', function (event) {
          var msg = (event.reason && event.reason.message) || '';
          if (/Failed to fetch/i.test(msg) || /dynamically imported/i.test(msg) || /import.*module/i.test(msg)) {
            forceReload();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Splash estático hasta que React monte (carga del bundle JS) -->
      <div id="boot-splash" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(140deg,#eef4fb 0%,#ddeeff 55%,#e8f3fd 100%);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;position:relative;overflow:hidden;">
        <style>
          @keyframes boot-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(280%); } }
          @keyframes boot-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        </style>
        <div style="position:relative;z-index:1;width:min(420px,100%);text-align:center;animation:boot-fade .5s ease-out both;">
          <img src="/logo_azul.png" alt="Centro Médico Santa Cruz" style="display:block;width:min(300px,72vw);height:auto;margin:0 auto 22px;object-fit:contain;" />
          <div style="font-size:.9rem;color:#64748b;font-weight:500;margin-bottom:26px;">Cargando aplicación…</div>
          <div style="height:8px;border-radius:999px;background:rgba(37,99,235,.12);overflow:hidden;">
            <div style="height:100%;width:42%;border-radius:inherit;background:linear-gradient(90deg,#2563eb,#0ea5e9,#14b8a6);animation:boot-bar 1.4s ease-in-out infinite;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
