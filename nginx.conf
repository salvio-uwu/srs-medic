# ── Evitar cacheo de respuestas 404 en assets versionados ──
# $status solo está disponible en fase de filtro de headers (después de
# try_files), por lo que map evalúa correctamente.
map $status $asset_expires {
    200     1y;
    default epoch;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        text/xml
        image/svg+xml
        application/wasm;

    # ─── Archivos versionados (hasheados por Vite) ───
    # Cache agresivo solo en 200 OK (add_header sin "always" no aplica
    # a 404). expires usa map para no cachear respuestas de error.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|wav)$ {
        try_files $uri =404;
        expires $asset_expires;
        add_header Cache-Control "public, max-age=31536000";
    }

    # ─── APK Android (descarga directa) ───
    location = /descargas/SRS-Medic.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="Centro-Medico-Santa-Cruz.apk"';
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ^~ /descargas/ {
        try_files $uri $uri/ =404;
    }

    # ─── index.html: jamás se cachea, jamás 304 ───
    location = /index.html {
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ─── SPA fallback ───
    location / {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }
}
